# Stack für den Portainer-Web-Editor: nutzt das fertig gebaute Image aus der
# GitHub Container Registry (gebaut von .github/workflows/docker-image.yml).
# Kein Build-Kontext nötig -> einfach den Inhalt in den Portainer-Editor kopieren.
#
# Der Container liefert die App aus und proxyt /api/ same-origin zu Immich
# (IMMICH_URL unten anpassen). Der Browser spricht dadurch nur mit dieser einen
# Origin, kein CORS auf Immich nötig.
#
# Trage unten IMMICH_API_KEY ein: Der Schlüssel wird beim Start in /config.js
# ausgeliefert, sodass sich JEDES Gerät im Netzwerk ohne Eingabe von Server-URL
# und API-Key automatisch verbindet. Lässt du ihn leer, fragt die App pro Gerät
# nur nach dem API-Schlüssel (die Server-URL entfällt in beiden Fällen).
#
# Image entweder auf "public" stellen ODER in Portainer eine ghcr.io-Registry-
# Anmeldung hinterlegen (Username = GitHub-Name, Passwort = PAT mit read:packages).
services:
  immich-book:
    image: ghcr.io/faeslich8/bilderbuch:latest
    ports:
      - "8080:80"
    environment:
      # URL des Immich-Servers, wie ihn NGINX (im Container) erreicht -
      # z. B. Container-Name + interner Port, wenn beide im selben Docker-Netzwerk laufen.
      IMMICH_URL: "http://immich-server:2283"
      # Zentral hinterlegter Immich-API-Schlüssel -> jedes Gerät verbindet sich
      # automatisch ohne Eingabe. Empfehlung: dedizierten (statt Admin-)Schlüssel,
      # da jeder im LAN, der die Seite lädt, damit auf Immich zugreift.
      IMMICH_API_KEY: ""
    volumes:
      # Persistenter zentraler Bearbeitungs-Speicher (ein JSON pro Album),
      # damit alle Geräte im Netzwerk denselben Bearbeitungsstand sehen.
      - immichbook-store:/data
    networks:
      - immich
    restart: unless-stopped

volumes:
  immichbook-store:

networks:
  immich:
    external: true
    # Name des Docker-Netzwerks, in dem dein Immich-Server läuft
    # (siehe `docker network ls`, z. B. "immich_default" bei Standard-Compose-Setups).
    name: immich_default
