<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BilderBuch">
  <rect width="64" height="64" rx="13" fill="#2c2622"/>
  <!-- Aufgeschlagenes Buch (Basis) -->
  <path d="M32 42 L9 38 Q7 47 9 54 L32 50 Z" fill="#c2603f"/>
  <path d="M32 42 L55 38 Q57 47 55 54 L32 50 Z" fill="#a44b30"/>
  <rect x="31" y="41" width="2" height="10" rx="1" fill="#7a3a26"/>
  <!-- BB (creme) -->
  <g fill="#f7efe6">
    <rect x="8" y="14" width="6" height="34" rx="2.6"/>
    <rect x="8" y="14" width="17" height="17" rx="8"/>
    <rect x="8" y="31" width="19" height="17" rx="8.5"/>
    <rect x="34" y="14" width="6" height="34" rx="2.6"/>
    <rect x="34" y="14" width="17" height="17" rx="8"/>
    <rect x="34" y="31" width="19" height="17" rx="8.5"/>
  </g>
  <!-- Zähler der B (Buch scheint durch) -->
  <rect x="15" y="18" width="9" height="9" rx="4.5" fill="#c2603f"/>
  <rect x="15" y="33" width="10.5" height="9.5" rx="4.5" fill="#c2603f"/>
  <rect x="41" y="18" width="9" height="9" rx="4.5" fill="#a44b30"/>
  <rect x="41" y="33" width="10.5" height="9.5" rx="4.5" fill="#a44b30"/>
  <!-- Berg-Motiv (Bild) im linken B -->
  <circle cx="17.6" cy="20.2" r="1.3" fill="#f7efe6"/>
  <path d="M15.4 25.6 L18 21.6 L19.9 23.9 L21.6 20.6 L23.6 25.6 Z" fill="#f7efe6"/>
  <!-- Personen-Motiv im rechten B -->
  <circle cx="45.6" cy="20.4" r="2.1" fill="#f7efe6"/>
  <path d="M41.8 26 a3.7 3.1 0 0 1 7.4 0 Z" fill="#f7efe6"/>
</svg>
